<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Mia's World · Her Story, Your Choice</title>

<meta name="description" content="Step into Mia's tiny studio and the café where she works. Walk around, use things, and choose what she does.">
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script><script defer src="/_vercel/insights/script.js"></script>
<style>
  @font-face { font-family: Lilita; src: url(vendor/LilitaOne-Regular.ttf); }
  :root { --ol: #6b4046; --pink: #ff8fb4; --cream: #fff6f2; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2230; font-family: "Arial Rounded MT Bold", "Nunito", Arial, sans-serif; color: var(--ol); touch-action: none; -webkit-user-select: none; user-select: none; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; z-index: 5; }
  #hud { top: max(12px, env(safe-area-inset-top)); left: 12px; display: flex; gap: 8px; flex-wrap: wrap; max-width: calc(100% - 150px); }
  .chip { background: var(--cream); border: 3px solid var(--ol); border-radius: 18px; padding: 6px 12px; font-size: 15px; box-shadow: 0 4px 0 rgba(107,64,70,.35); white-space: nowrap; }
  .chip b { font-family: Lilita, sans-serif; font-weight: normal; font-size: 18px; }
  .chip.money b { color: #3f8a5e; } .chip.rent b { color: #e0475f; }
  #tools { top: max(12px, env(safe-area-inset-top)); right: 12px; display: flex; gap: 8px; }
  .btn { background: var(--cream); border: 3px solid var(--ol); border-radius: 16px; padding: 7px 11px; font: inherit; font-size: 18px; color: var(--ol); cursor: pointer; box-shadow: 0 4px 0 rgba(107,64,70,.35); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(107,64,70,.35); }
  #bubble { position: fixed; z-index: 6; transform: translate(-50%, -100%); max-width: min(78vw, 340px); background: #fff; border: 3px solid var(--ol); border-radius: 22px; padding: 10px 16px 12px; font-size: 18px; line-height: 1.3; box-shadow: 0 5px 0 rgba(107,64,70,.3); pointer-events: auto; cursor: pointer; display: none; }
  #bubble:after { content: ""; position: absolute; left: 50%; bottom: -15px; margin-left: -10px; border: 10px solid transparent; border-top: 13px solid var(--ol); }
  #bubble .who { font-family: Lilita, sans-serif; color: #e0647a; font-size: 15px; display: block; margin-bottom: 2px; }
  #bubble .next { float: right; font-size: 12px; opacity: .5; margin-top: 4px; }
  #menu { position: fixed; z-index: 7; transform: translate(-50%, -100%); display: none; flex-direction: column; gap: 6px; align-items: stretch; }
  #menu .title { text-align: center; font-family: Lilita, sans-serif; font-size: 17px; color: #fff; text-shadow: 0 2px 0 var(--ol), 2px 0 0 var(--ol), -2px 0 0 var(--ol), 0 -2px 0 var(--ol); margin-bottom: 2px; }
  #menu button { background: #fff; border: 3px solid var(--ol); border-radius: 16px; padding: 8px 16px; font: inherit; font-size: 16px; color: var(--ol); cursor: pointer; box-shadow: 0 4px 0 rgba(107,64,70,.3); white-space: nowrap; }
  #menu button:hover { background: #ffe1ea; }
  #tip { position: fixed; z-index: 6; pointer-events: none; background: rgba(255,255,255,.95); border: 2px solid var(--ol); border-radius: 12px; padding: 3px 10px; font-size: 14px; display: none; transform: translate(12px, 12px); }
  #hint { bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: rgba(255,246,242,.92); border: 3px solid var(--ol); border-radius: 18px; padding: 8px 16px; font-size: 15px; text-align: center; transition: opacity .6s; max-width: 90vw; }
  #choice { inset: 0; display: none; align-items: center; justify-content: center; background: rgba(43,34,48,.45); flex-direction: column; gap: 14px; padding: 20px; }
  #choice .q { font-family: Lilita, sans-serif; font-size: clamp(26px, 6vw, 44px); color: #fff; text-shadow: 0 3px 0 var(--ol), 3px 0 0 var(--ol), -3px 0 0 var(--ol), 0 -3px 0 var(--ol); text-align: center; }
  #choice .cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  #choice .card { width: min(42vw, 260px); border: 4px solid var(--ol); border-radius: 26px; padding: 16px; color: #fff; cursor: pointer; box-shadow: 0 6px 0 rgba(107,64,70,.4); text-align: center; position: relative; }
  #choice .card .l { position: absolute; top: -18px; left: -14px; width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--ol); border: 3px solid var(--ol); font-family: Lilita, sans-serif; font-size: 24px; line-height: 38px; }
  #choice .card .t { font-family: Lilita, sans-serif; font-size: clamp(22px, 5vw, 32px); text-shadow: 0 2px 0 var(--ol), 2px 0 0 var(--ol), -2px 0 0 var(--ol), 0 -2px 0 var(--ol); }
  #choice .card .s { font-size: 14px; margin-top: 6px; color: var(--ol); background: rgba(255,255,255,.85); border-radius: 12px; padding: 4px 8px; }
  #phone { inset: 0; display: none; align-items: center; justify-content: center; background: rgba(43,34,48,.5); }
  #phone .dev { width: min(72vw, 300px); aspect-ratio: 9 / 18.5; background: #ffb3c8; border: 4px solid var(--ol); border-radius: 40px; padding: 12px; box-shadow: 0 8px 0 rgba(107,64,70,.4); }
  #phone .scr { width: 100%; height: 100%; background: #fff7f3; border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; }
  #phone .bar { background: #ff8fb4; color: #fff; font-family: Lilita, sans-serif; font-size: 22px; text-align: center; padding: 26px 0 14px; }
  #phone .bal { text-align: center; margin: 22px 0 8px; font-size: 15px; opacity: .7; }
  #phone .amt { text-align: center; font-family: Lilita, sans-serif; font-size: 50px; color: #e0475f; }
  #phone .row { display: flex; justify-content: space-between; background: #fff; margin: 6px 14px; border-radius: 14px; padding: 10px 12px; font-size: 14px; border: 2px solid #ffe1ea; }
  #phone .close { margin: auto 14px 16px; }
  #fade { inset: 0; background: #2b2230; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 20; display: flex; align-items: center; justify-content: center; color: #fff; font-family: Lilita, sans-serif; font-size: clamp(28px, 7vw, 54px); }
  #loading { inset: 0; z-index: 30; background: linear-gradient(#ffe1ea, #ffd0c2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: opacity .6s; }
  #loading h1 { font-family: Lilita, sans-serif; font-weight: normal; font-size: clamp(34px, 8vw, 64px); margin: 0; color: #fff; text-shadow: 0 4px 0 var(--ol), 3px 0 0 var(--ol), -3px 0 0 var(--ol), 0 -3px 0 var(--ol); }
  #loading p { margin: 0; font-size: 16px; }
  #loading canvas { width: 160px; height: 300px; }
  #start { display: none; font-size: 22px; padding: 10px 28px; }
</style></head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="ui"><div class="chip" id="place">🏠 <b>Home</b></div><div class="chip money">💵 <b id="money">$12.43</b></div><div class="chip rent">📅 Rent due: <b id="rent">3 days</b></div></div>
<div id="tools" class="ui"><button class="btn" id="bMood" title="Day / night">🌙</button><button class="btn" id="bHelp" title="Help">❓</button></div>

<div id="phone" class="ui"></div>
<div id="fade" class="ui"></div>
<div id="loading" class="ui"><h1>Mia's World</h1><canvas id="lmia" width="320" height="600"></canvas><p id="lmsg">Loading her tiny home…</p><button class="btn" id="start">Step inside 💗</button></div>
<script src="vendor/mia.js"></script>
<script type="module" src="play.js"></script>
