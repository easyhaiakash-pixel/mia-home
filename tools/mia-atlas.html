<!doctype html><meta charset="utf-8"><title>Mia sprite atlas</title>
<script src="../vendor/mia.js"></script>
<script type="module">
// Draws every Mia frame the Unity game needs into two atlases (home clothes, work apron) + Adrian + sleeping Mia.
import { drawMiaFull, drawMiaSleep, drawAdrianBack } from '../parts/mia-body.js';
const CW = 340, CH = 491, K = 0.47, OX = 170, OY = 120, COLS = 12;
const FACES = ['neutral', 'happy', 'sad', 'teary', 'angry', 'shock'];
function frames(work) {
  const F = [];
  for (let i = 0; i < 12; i++) F.push(['walk_' + i, { pose: 'walk', phase: i / 12 }]);
  if (work) for (let i = 0; i < 12; i++) F.push(['walkcup_' + i, { pose: 'walk', phase: i / 12, hold: 'cup' }]);
  if (work) for (let i = 0; i < 12; i++) F.push(['walkcash_' + i, { pose: 'walk', phase: i / 12, hold: 'cash' }]);
  FACES.forEach(f => F.push(['stand_' + f, { pose: 'stand', face: f }]));
  F.push(['stand_blink', { pose: 'stand', blink: true }]);
  FACES.forEach(f => [0, 1].forEach(k => F.push([`talk_${f}_${k}`, { pose: 'talk', face: f, phase: k * 0.5 }])));
  FACES.forEach(f => [0, 1].forEach(k => F.push([`wave_${f}_${k}`, { pose: 'wave', face: f, phase: k * 0.5 }])));
  FACES.forEach(f => F.push(['think_' + f, { pose: 'think', face: f }]));
  FACES.forEach(f => F.push(['shrug_' + f, { pose: 'shrug', face: f }]));
  if (!work) FACES.forEach(f => F.push(['sit_' + f, { pose: 'sit', face: f }]));
  if (!work) FACES.forEach(f => F.push(['sitphone_' + f, { pose: 'sit', face: f, hold: 'phone' }]));
  FACES.forEach(f => F.push(['cup_' + f, { pose: 'stand', face: f, hold: 'cup' }]));
  if (work) FACES.forEach(f => F.push(['cash_' + f, { pose: 'stand', face: f, hold: 'cash' }]));
  if (!work) FACES.forEach(f => F.push(['phone_' + f, { pose: 'stand', face: f, hold: 'phone' }]));
  return F;
}
const OUT = {};
const b64 = c => c.toDataURL('image/png').split(',')[1];
for (const work of [false, true]) {
  const F = frames(work), rows = Math.ceil(F.length / COLS);
  const c = document.createElement('canvas'); c.width = 4096; c.height = 4096; const g = c.getContext('2d');
  const meta = { cell: [CW, CH], anchor: [OX, OY + 747 * K], metersPerPx: (1.3 / 977) / K, size: [c.width, c.height], names: [], pos: [] };
  F.forEach(([name, o], i) => {
    const x = (i % COLS) * CW, y = Math.floor(i / COLS) * CH;
    g.save(); g.beginPath(); g.rect(x, y, CW, CH); g.clip();
    drawMiaFull(g, x + OX, y + OY, K, Object.assign({ top: '#ffc2d1', skirt: work ? '#9fd3c7' : '#c9b6ec', apron: work }, o));
    g.restore();
    meta.names.push(name); meta.pos.push(x, y);
  });
  if (rows * CH > 4096) throw new Error('atlas too small ' + F.length);
  OUT[`mia-${work ? 'work' : 'home'}.png`] = b64(c);
  OUT[`mia-${work ? 'work' : 'home'}.json`] = btoa(JSON.stringify(meta));
}
// sleeping Mia + Adrian (one picture each)
{ const c = document.createElement('canvas'); c.width = 440; c.height = 330; drawMiaSleep(c.getContext('2d'), 220, 318, 0.62, {});
  OUT['mia-sleep.png'] = b64(c); OUT['mia-sleep.json'] = btoa(JSON.stringify({ size: [440, 330], anchor: [220, 318], metersPerPx: (1.3 / 977) / 0.62 })); }
{ const c = document.createElement('canvas'); c.width = 330; c.height = 460; drawAdrianBack(c.getContext('2d'), 150, 420, 0.45, { arm: true });
  OUT['adrian.png'] = b64(c); OUT['adrian.json'] = btoa(JSON.stringify({ size: [330, 460], anchor: [150, 420], metersPerPx: 0.00112 / 0.45 })); }
// Adrian's napkin note
{ const c = document.createElement('canvas'); c.width = 400; c.height = 300; const g = c.getContext('2d');
  g.fillStyle = '#fffdf6'; g.fillRect(0, 0, 400, 300); g.fillStyle = '#2f2f3f'; g.font = 'italic 46px "Snell Roundhand", "Segoe Script", cursive'; g.textAlign = 'center';
  g.fillText('Same time', 200, 112); g.fillText('tomorrow.', 200, 172); g.fillText('\u2014 A', 280, 244); OUT['note.png'] = b64(c); }
window.OUT = OUT; window.DONE = true;
</script>
